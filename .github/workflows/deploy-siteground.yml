# Builds the public site as static files and uploads them to SiteGround.
#
# The admin CMS (on Vercel) publishes by committing to main, so every
# publish/edit/delete lands here and goes live once this job finishes.
#
# Disabled until the repo variable SITEGROUND_DEPLOY_ENABLED is set to "true".
#
# Required secrets:
#   SITEGROUND_SSH_KEY    private key from Site Tools > Devs > SSH Keys Manager
#   SITEGROUND_SSH_HOST   SSH hostname from the same screen
#   SITEGROUND_SSH_USER   SSH username from the same screen
#   SITEGROUND_WEBROOT    absolute path of the site's public_html
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_GTAG_ID, NEXT_PUBLIC_NEWSLETTER_ENDPOINT,
#   NEXT_PUBLIC_ADSENSE_CLIENT, NEXT_PUBLIC_ADSENSE_SLOT_INARTICLE,
#   NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_END, NEXT_PUBLIC_ADSENSE_SLOT_LISTING,
#   NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR

name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each deploy contains every earlier commit, so a newer push supersedes an
# in-flight one.
concurrency:
  group: deploy-siteground
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.SITEGROUND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      SSH_PORT: '18765'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build static site
        run: node scripts/build-static.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GTAG_ID: ${{ secrets.NEXT_PUBLIC_GTAG_ID }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_INARTICLE: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_INARTICLE }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_END: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_END }}
          NEXT_PUBLIC_ADSENSE_SLOT_LISTING: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_LISTING }}
          NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/siteground
          chmod 600 ~/.ssh/siteground
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload
        env:
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
        run: |
          set -x
          # $HOME, not ~: a tilde inside a variable is never expanded, so ssh
          # would look for a key file literally named "~/.ssh/siteground".
          SSH="ssh -i $HOME/.ssh/siteground -p $SSH_PORT -o BatchMode=yes"
          # Fail here, loudly, if the key or host is wrong.
          $SSH "$SSH_USER@$SSH_HOST" 'echo connected as $(whoami)'
          # Let the server name its own web root: SiteGround's /home/<user> is
          # a symlink to /home/customer, and the receiving rsync resolves it
          # before creating directories, which fails. Deriving it here also
          # keeps the path out of a masked secret, so it prints in the log.
          TARGET=$($SSH "$SSH_USER@$SSH_HOST" 'readlink -f ~/www/*/public_html | head -1')
          echo "resolved web root: $TARGET"
          test -n "$TARGET"
          # .well-known holds SiteGround's SSL challenges. contact-config.php
          # sits above public_html, so --delete never reaches it.
          rsync -az --delete \
            --exclude '.well-known' \
            -e "$SSH" \
            out/ "$SSH_USER@$SSH_HOST:$REL/"

      - name: Flush SiteGround cache
        env:
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
        run: |
          # SiteGround's proxy caches page bodies by URL, so a fresh deploy
          # stays invisible until the cache is flushed. flush_cache takes a
          # 1-byte boolean ("1", not "true"); id=1 is the account's main domain.
          ssh -i "$HOME/.ssh/siteground" -p "$SSH_PORT" -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'site-tools-client -j domain update id=1 flush_cache=1'
